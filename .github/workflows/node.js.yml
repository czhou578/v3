# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Dispatched by the dependabot-merge job below: a merge performed with the
  # workflow token does not fire the `push` trigger, so it asks for the deploy
  # explicitly instead.
  workflow_dispatch:

# One deploy at a time, so a push to main cannot be overwritten by an older
# run that happened to finish later. Pull requests each get their own group:
# sharing one group would cancel queued PR runs whenever several open at once,
# which is exactly what Dependabot does.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: false

jobs:
  # Runs every check and builds the site. It holds only a read-only token and
  # installs with --ignore-scripts: this is the job that executes third-party
  # package code (including on Dependabot PRs), so nothing it runs may be able
  # to push to the repository.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the token in .git/config for later steps to read.
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      # Native tools (esbuild, sharp, workerd) ship prebuilt binaries as
      # optional dependencies, so no install script is needed.
      - run: npm ci --ignore-scripts
      # Every package must come from the public npm registry with a hash.
      - name: Check lockfile sources
        run: node scripts/check-lockfile.mjs
      # Fails on high or critical advisories in what ships (the site's runtime
      # dependencies). Build tools are left out: their remaining advisories
      # have no fixed release yet; see SECURITY_AUDIT.md, F7.
      - name: Audit runtime dependencies
        run: npm audit --audit-level=high --omit=dev
      # The MCP server reads public/projects.json from main, so fail fast if
      # data/projects.json was edited without regenerating and committing it.
      - run: node scripts/generate-agent-files.mjs --check
      - name: Lint
        run: npm run lint
      # The MCP worker has its own tsconfig (Workers runtime types, no DOM) and
      # is excluded from the site's, so it needs its own check.
      - name: Typecheck MCP worker
        run: npm run mcp:typecheck
      - name: Check formatting
        run: npm run format:check
      - run: npm run build --if-present
        env:
          # Repository variable; analytics are skipped when it is unset.
          NEXT_PUBLIC_CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
      - name: Upload site
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: out
          # out/.nojekyll must survive: without it GitHub Pages runs Jekyll,
          # which drops the _next directory and breaks the site.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Publishes the artifact built above. This is the only job that can write
  # to the repository, and it runs no npm code at all. Pull requests never
  # reach it: only a commit that is actually on main may reach the live site.
  deploy:
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: out
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages # The branch the action should deploy to.
          folder: out # The folder the action should deploy.

  # Deploys the MCP worker so production cannot drift from main, then checks
  # that the live server completes the MCP handshake. Needs the repository
  # secrets CLOUDFLARE_API_TOKEN (scoped to "Workers Scripts: Edit") and
  # CLOUDFLARE_ACCOUNT_ID; without them it warns and skips.
  deploy-mcp:
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Check for Cloudflare credentials
        if: env.HAS_CF_TOKEN != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not set; the MCP worker was not deployed."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_CF_TOKEN == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.HAS_CF_TOKEN == 'true'
        with:
          node-version: 22.x
          cache: "npm"
      - run: npm ci --ignore-scripts
        if: env.HAS_CF_TOKEN == 'true'
      - name: Deploy worker
        if: env.HAS_CF_TOKEN == 'true'
        run: npx wrangler deploy -c my-portfolio-mcp/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test
        if: env.HAS_CF_TOKEN == 'true'
        run: |
          body='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          for attempt in 1 2 3 4 5; do
            out=$(curl -sS -m 20 -X POST https://my-portfolio-mcp.colinzhou.workers.dev \
              -H 'Content-Type: application/json' -d "$body" || true)
            if echo "$out" | grep -q '"serverInfo"'; then echo "MCP handshake OK"; exit 0; fi
            sleep 10
          done
          echo "::error::MCP initialize did not return serverInfo. Last response: $out"
          exit 1

  # Merge Dependabot pull requests on their own once every check above passes.
  # Only runs for commits Dependabot itself pushed: if a person pushes to the
  # branch, the actor changes and the PR goes back to needing a manual merge.
  dependabot-merge:
    needs: build
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write # to dispatch the deploy run after merging
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Merge
        run: |
          # GitHub computes mergeability lazily, so it can read UNKNOWN for a
          # moment after a push; give it a few tries before deciding.
          for attempt in 1 2 3 4 5 6; do
            state=$(gh pr view "$PR" --json mergeStateStatus --jq .mergeStateStatus)
            [ "$state" != "UNKNOWN" ] && break
            sleep 10
          done
          echo "merge state: $state"
          case "$state" in
            DIRTY)
              # Several Dependabot PRs touch package-lock.json, so after one
              # merges the rest conflict. Dependabot rebases them itself within
              # a few minutes, and the resulting push re-runs this workflow.
              echo "Conflicts with main; waiting for Dependabot to rebase."
              exit 0 ;;
            BLOCKED)
              echo "Blocked by branch protection; leaving for a manual merge."
              exit 0 ;;
          esac
          gh pr merge "$PR" --merge
      - name: Deploy main
        # The merge above was made with the workflow token, so it did not
        # trigger the `push` run that normally publishes the site.
        if: success()
        run: |
          merged=$(gh pr view "$PR" --json state --jq .state)
          if [ "$merged" = "MERGED" ]; then
            gh workflow run node.js.yml --ref main
          else
            echo "PR was not merged; nothing to deploy."
          fi
