# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# One deploy at a time, so a push to main cannot be overwritten by an older
# run that happened to finish later.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci
      # The MCP server reads public/projects.json from main, so fail fast if
      # data/projects.json was edited without regenerating and committing it.
      - run: node scripts/generate-agent-files.mjs --check
      - name: Lint
        run: npm run lint
      # The MCP worker has its own tsconfig (Workers runtime types, no DOM) and
      # is excluded from the site's, so it needs its own check.
      - name: Typecheck MCP worker
        run: npm run mcp:typecheck
      - name: Check formatting
        run: npm run format:check
      - run: npm run build --if-present
        env:
          # Repository variable; analytics are skipped when it is unset.
          NEXT_PUBLIC_CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
      - name: Deploy 🚀
        # Pull requests run every check above but must never publish: only a
        # commit that is actually on main may reach the live site.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages # The branch the action should deploy to.
          folder: out # The folder the action should deploy.
