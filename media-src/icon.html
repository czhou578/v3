<!doctype html>
<!--
  Source for the site icon: a "CZ" monogram on the site's indigo. Rendered at
  512x512 and downscaled to public/favicon.ico (16, 32, 48), favicon-32.png,
  and apple-touch-icon.png (180) by `npm run icons`.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@800&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 512px;
        height: 512px;
        overflow: hidden;
        background: transparent;
      }
      .tile {
        width: 512px;
        height: 512px;
        border-radius: 112px;
        background: linear-gradient(160deg, #6366f1, #4f46e5);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Inter, system-ui, sans-serif;
        font-weight: 800;
        font-size: 250px;
        letter-spacing: -0.06em;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="tile">CZ</div>
  </body>
</html>
